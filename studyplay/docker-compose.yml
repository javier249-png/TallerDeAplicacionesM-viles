version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyplay_backend
    restart: always
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - PORT=9000
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3